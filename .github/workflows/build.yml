name: Build Mokarate Chroma image
# Bakes the Chroma model set into the Salad ComfyUI *runtime* base image and
# pushes it to GHCR, so Salad cold nodes never download models after start.
# Runtime base (not flux1dev): the flux1dev image's manifest makes the
# wrapper download an 11 GB FLUX checkpoint before startup and run a FLUX
# warmup prompt; the runtime image has no manifest and no warmup, so it
# reaches /ready as soon as ComfyUI launches.
# GHCR allows max 10 GB per layer, so the 17.8 GB Chroma file is split into
# 8 GiB parts (one layer each) and reassembled at container start by
# assemble.sh, run via the Salad group's command override.
# Salad's max container image size is 35 GB (compressed) — verified against
# that in the Verify step.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-chroma
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      BASE: ghcr.io/saladtechnologies/comfyui-api:comfy0.35.0-api1.19.2-torch2.13.0-cuda13.0-runtime
      BASE_DIGEST: sha256:36aa037f13b3cac57457bfbae9d3a019dfebebb811f49c5488775a442b3daef2
      TARGET: ghcr.io/ththth-mokarate/mokarate-comfyui-chroma:chroma1-hd
      CHROMA_SHA256: d446d9695d08276f61e53653e025289dd96f7a489c27982a1fa54ecabc06642a
      CHROMA_COMMIT: 0e0c60ece1e82b17cb7f77342d765ba5024c40c0
      T5_SHA256: 398e09dca10667317ecd6762e16d08f60d6fb228c59e84a10f9eda6582d55557
      T5_COMMIT: 6fa71947a0603acb5ff06cd65b0d42b75998bdb0
      AE_SHA256: afc8e28272cd15db3919bacdb6918ce9c1ed22e96cb12c4d5ed0fba823529e38
      AE_COMMIT: 5b072540ef86570fecb8249c505f23d5bdeb88cd
      CHROMA_SIZE: 17800038288
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@cf1e78c50ca91e757bab3edc229027eebfc07871
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Check disk space
        run: |
          set -euo pipefail
          df -h .
          available=$(df -PB1 . | awk 'NR==2 {print $4}')
          if (( available < 45 * 1024 * 1024 * 1024 )); then
            echo "::error::less than 45 GiB free disk, refusing to build"
            exit 1
          fi

      - name: Install crane 0.22.1 (checksum-verified)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/go-containerregistry_Linux_x86_64.tar.gz https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz
          curl -fsSL -o /tmp/checksums.txt https://github.com/google/go-containerregistry/releases/download/v0.22.1/checksums.txt
          (cd /tmp && grep 'go-containerregistry_Linux_x86_64.tar.gz' checksums.txt | sha256sum -c -)
          tar --no-same-owner -xzf /tmp/go-containerregistry_Linux_x86_64.tar.gz -C /tmp crane
          sudo install -m 755 /tmp/crane /usr/local/bin/crane
          crane version

      - name: Download models (fail-fast + SHA256 verified)
        run: |
          set -euo pipefail
          mkdir -p stage/opt/ComfyUI/models/diffusion_models stage/opt/ComfyUI/models/text_encoders stage/opt/ComfyUI/models/vae layers
          M=stage/opt/ComfyUI/models
          # Retry keeps the .part file so curl -C - resumes; only a hash/size
          # mismatch discards it.
          dl() { # $1=url $2=dest $3=sha256
            local url="$1" dest="$2" sha="$3"
            for i in 1 2 3 4 5; do
              if curl -fL -C - --connect-timeout 30 --speed-limit 1024 --speed-time 120 \
                   -o "${dest}.part" "$url"; then
                if echo "$sha  ${dest}.part" | sha256sum -c -; then
                  mv "${dest}.part" "$dest"; return 0
                fi
                echo "hash mismatch, discarding ${dest}.part" >&2
                rm -f "${dest}.part"
              else
                echo "download failed (attempt $i), keeping partial file for resume" >&2
              fi
              sleep 15
            done
            echo "FAILED: $url" >&2; return 1
          }
          dl_part() { # $1=url $2=dest $3=range $4=expected_size
            local url="$1" dest="$2" range="$3" expected="$4"
            for i in 1 2 3 4 5; do
              if curl -fL -r "$range" -C - --connect-timeout 30 --speed-limit 1024 --speed-time 120 \
                   -o "${dest}.part" "$url"; then
                if [ "$(wc -c < "${dest}.part")" = "$expected" ]; then
                  mv "${dest}.part" "$dest"; return 0
                fi
                echo "part size mismatch (expected $expected), discarding" >&2
                rm -f "${dest}.part"
              else
                echo "part download failed (attempt $i), keeping partial file for resume" >&2
              fi
              sleep 15
            done
            echo "FAILED part: $url [$range]" >&2; return 1
          }
          # Chroma (17.8 GB) in 8 GiB ranged slices, then verify the joined hash.
          CHROMA_URL=https://huggingface.co/lodestones/Chroma1-HD/resolve/$CHROMA_COMMIT/Chroma1-HD.safetensors
          dl_part "$CHROMA_URL" "$M/diffusion_models/chroma.part-00" "0-8589934591" 8589934592
          dl_part "$CHROMA_URL" "$M/diffusion_models/chroma.part-01" "8589934592-17179869183" 8589934592
          dl_part "$CHROMA_URL" "$M/diffusion_models/chroma.part-02" "17179869184-" 620169104
          cat "$M/diffusion_models/chroma.part-00" "$M/diffusion_models/chroma.part-01" "$M/diffusion_models/chroma.part-02" \
            | sha256sum -c <(echo "$CHROMA_SHA256  -")
          dl https://huggingface.co/silveroxides/flan-t5-xxl-encoder-only/resolve/$T5_COMMIT/flan-t5-xxl_float8_e4m3fn_scaled_stochastic.safetensors \
             "$M/text_encoders/flan-t5-xxl_float8_e4m3fn_scaled_stochastic.safetensors" "$T5_SHA256"
          dl https://huggingface.co/Comfy-Org/Lumina_Image_2.0_Repackaged/resolve/$AE_COMMIT/split_files/vae/ae.safetensors \
             "$M/vae/ae.safetensors" "$AE_SHA256"
          ls -la "$M/diffusion_models" "$M/text_encoders" "$M/vae"

      - name: Build layers (deterministic tars)
        run: |
          set -euo pipefail
          M=stage/opt/ComfyUI/models
          # Atomic assembly: build into a .tmp file, verify size + SHA256,
          # then rename. The parts are image layers, so deleting them would
          # not free disk — and keeping them lets a crashed assembly retry.
          # The wrapper launches ComfyUI via relative "init.sh", so the API
          # must be exec'd from /opt/ComfyUI, not from the models dir.
          cat > stage/opt/ComfyUI/assemble.sh <<'EOS'
          #!/bin/sh
          # Reassemble the split Chroma model (if needed), then start the ComfyUI API.
          # Run via the Salad group command override: ["/bin/sh", "/opt/ComfyUI/assemble.sh"]
          set -e
          MODEL=/opt/ComfyUI/models/diffusion_models/Chroma1-HD.safetensors
          TMP="${MODEL}.tmp"
          SIZE=17800038288
          SHA=d446d9695d08276f61e53653e025289dd96f7a489c27982a1fa54ecabc06642a
          cd /opt/ComfyUI/models/diffusion_models
          if [ ! -f "$MODEL" ] || [ "$(wc -c < "$MODEL")" != "$SIZE" ]; then
            echo "Assembling Chroma1-HD from parts..."
            rm -f "$TMP"
            cat chroma.part-00 chroma.part-01 chroma.part-02 > "$TMP"
            [ "$(wc -c < "$TMP")" = "$SIZE" ] || { echo "assembled Chroma size mismatch" >&2; exit 1; }
            printf '%s  %s\n' "$SHA" "$TMP" | sha256sum -c -
            mv -f "$TMP" "$MODEL"
            echo "Chroma assembly completed."
          fi
          cd /opt/ComfyUI
          exec /opt/ComfyUI/comfyui-api
          EOS
          chmod +x stage/opt/ComfyUI/assemble.sh
          TARFLAGS="--sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner"
          tar $TARFLAGS -cf layers/chroma-part-00.tar -C stage opt/ComfyUI/models/diffusion_models/chroma.part-00
          rm "$M/diffusion_models/chroma.part-00"
          tar $TARFLAGS -cf layers/chroma-part-01.tar -C stage opt/ComfyUI/models/diffusion_models/chroma.part-01
          rm "$M/diffusion_models/chroma.part-01"
          tar $TARFLAGS -cf layers/chroma-part-02.tar -C stage opt/ComfyUI/models/diffusion_models/chroma.part-02
          rm "$M/diffusion_models/chroma.part-02"
          tar $TARFLAGS -cf layers/text_encoders.tar -C stage opt/ComfyUI/models/text_encoders
          rm "$M/text_encoders/flan-t5-xxl_float8_e4m3fn_scaled_stochastic.safetensors"
          tar $TARFLAGS -cf layers/vae.tar -C stage opt/ComfyUI/models/vae
          rm "$M/vae/ae.safetensors"
          tar $TARFLAGS -cf layers/assemble.tar -C stage opt/ComfyUI/assemble.sh
          ls -la layers/
          df -h .

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        # crane reads the same ~/.docker/config.json written by docker login

      - name: Append layers and push test tag
        run: |
          echo "TEST_TAG=$TARGET-test-$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          crane append --platform linux/amd64 \
            -b "$BASE@$BASE_DIGEST" \
            -f layers/chroma-part-00.tar \
            -f layers/chroma-part-01.tar \
            -f layers/chroma-part-02.tar \
            -f layers/text_encoders.tar \
            -f layers/vae.tar \
            -f layers/assemble.tar \
            -t "$TARGET-test-$GITHUB_RUN_ID"

      - name: Verify test image
        run: |
          set -euo pipefail
          crane config --platform linux/amd64 "$BASE@$BASE_DIGEST" > base.json
          crane config "$TEST_TAG" > target.json
          crane manifest "$TEST_TAG" > manifest.json
          python3 - <<'PY'
          import json
          base = json.load(open("base.json"))
          target = json.load(open("target.json"))
          manifest = json.load(open("manifest.json"))
          bl, tl = base["rootfs"]["diff_ids"], target["rootfs"]["diff_ids"]
          assert len(tl) == len(bl) + 6, f"layer count {len(tl)} != base {len(bl)} + 6"
          assert tl[:len(bl)] == bl, "base layers changed"
          for key in ("Cmd", "WorkingDir", "User"):
              assert target["config"].get(key) == base["config"].get(key), key
          assert target["architecture"] == "amd64" and target["os"] == "linux"
          assert "MODEL_DIR=/opt/ComfyUI/models" in target["config"].get("Env", [])
          layers = manifest["layers"]
          total = sum(x["size"] for x in layers) + manifest["config"]["size"]
          print(f"compressed image: {total/1e9:.2f} GB; largest layer: {max(x['size'] for x in layers)/1e9:.2f} GB")
          assert all(x["size"] < 10_000_000_000 for x in layers), "GHCR layer size limit exceeded"
          assert total < 35_000_000_000, "Salad image size limit (35 GB compressed) exceeded"
          print("image verified: 6 new layers, base intact, MODEL_DIR present, size within limits")
          PY
          crane digest "$TEST_TAG"

      - name: Promote test tag to chroma1-hd
        run: crane copy "$TEST_TAG" "$TARGET"
