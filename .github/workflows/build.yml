name: Build Mokarate Chroma image
# Bakes the Chroma model set into the Salad ComfyUI base image and pushes it
# to GHCR, so Salad cold nodes never download ~29GB after start.
# Runs on GitHub-hosted ubuntu-latest: fast HF downloads, no VM restarts,
# no local Docker needed (crane appends layers to the existing image).
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Check disk
        run: df -h

      - name: Install crane
        run: |
          curl -sL https://github.com/google/go-containerregistry/releases/latest/download/crane_linux_amd64.tar.gz | tar -xz -C /tmp crane
          sudo install -m 755 /tmp/crane /usr/local/bin/crane
          crane version

      - name: Download models and build one layer per model dir
        run: |
          set -euo pipefail
          mkdir -p stage/opt/ComfyUI/models/diffusion_models stage/opt/ComfyUI/models/text_encoders stage/opt/ComfyUI/models/vae layers
          dl() { # $1=url $2=dest — retry up to 5 times with resume
            for i in 1 2 3 4 5; do
              curl -C - -L -o "$2" "$1" && return 0 || sleep 15
            done
            echo "FAILED: $1" >&2; exit 1
          }
          dl https://huggingface.co/lodestones/Chroma1-HD/resolve/main/Chroma1-HD.safetensors \
             stage/opt/ComfyUI/models/diffusion_models/Chroma1-HD.safetensors
          tar -cf layers/diffusion_models.tar -C stage opt/ComfyUI/models/diffusion_models
          rm stage/opt/ComfyUI/models/diffusion_models/Chroma1-HD.safetensors
          df -h
          dl https://huggingface.co/silveroxides/flan-t5-xxl-encoder-only/resolve/main/flan-t5-xxl_float8_e4m3fn_scaled_stochastic.safetensors \
             stage/opt/ComfyUI/models/text_encoders/flan-t5-xxl_float8_e4m3fn_scaled_stochastic.safetensors
          tar -cf layers/text_encoders.tar -C stage opt/ComfyUI/models/text_encoders
          rm stage/opt/ComfyUI/models/text_encoders/flan-t5-xxl_float8_e4m3fn_scaled_stochastic.safetensors
          df -h
          dl https://huggingface.co/Comfy-Org/Lumina_Image_2.0_Repackaged/resolve/main/split_files/vae/ae.safetensors \
             stage/opt/ComfyUI/models/vae/ae.safetensors
          tar -cf layers/vae.tar -C stage opt/ComfyUI/models/vae
          rm stage/opt/ComfyUI/models/vae/ae.safetensors
          ls -la layers/

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        # crane reads the same ~/.docker/config.json written by docker login

      - name: Append layers and push baked image
        run: |
          crane append \
            -f layers/diffusion_models.tar \
            -f layers/text_encoders.tar \
            -f layers/vae.tar \
            -t ghcr.io/ththth-mokarate/mokarate-comfyui-chroma:chroma1-hd \
            ghcr.io/saladtechnologies/comfyui-api:comfy0.35.0-api1.19.2-torch2.13.0-cuda13.0-flux1dev

      - name: Verify pushed image
        run: |
          crane manifest ghcr.io/ththth-mokarate/mokarate-comfyui-chroma:chroma1-hd
          crane config ghcr.io/ththth-mokarate/mokarate-comfyui-chroma:chroma1-hd | python3 -c "import sys,json; c=json.load(sys.stdin); print('diff_ids:', len(c['rootfs']['diff_ids']), '(base 25 + 3 new = 28 expected)'); print('WorkingDir:', c['config'].get('WorkingDir')); print('MODEL_DIR:', [e for e in c['config'].get('Env',[]) if e.startswith('MODEL_DIR')])"
